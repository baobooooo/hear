[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browsecomp-langgraph"
version = "0.2.0"
description = "Persistent research-cell LangGraph harness for BrowseComp-Plus, vLLM and Sparse-vLLM"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
tokenizer = ["transformers>=4.51,<6", "jinja2>=3.1.6,<4"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
observability = ["prometheus-client>=0.20,<1"]

[project.scripts]
bcgraph = "bcgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires LangGraph", "mcp: requires the MCP SDK"]
