[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-deepresearchbench"
version = "0.1.0"
description = "Pure LangGraph multi-turn DeepResearchBench harness"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.15.0",
  "httpx==0.28.1",
  "langgraph==1.2.11",
  "openai==3.5.0",
  "pypdfium2==5.13.0",
  "pydantic==2.13.4",
  "tokenizers==0.23.1",
  "trafilatura==2.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
mtbench = "mtbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
